<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your New York</title>
<meta name="description" content="A pocket guide to New York, Dec 9–13: where to go, how to get there, and where to walk after dark.">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="New York">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="sign" id="sign">
  <div class="sign-row">
    <div class="sign-text">
      <h1 id="appTitle">Your New York</h1>
      <p id="appSub">Dec 9–13 · The Set, Hudson Yards</p>
    </div>
    <span class="bullet b-7" aria-hidden="true">7</span>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <section class="view" id="view-today" aria-labelledby="tab-today"></section>

  <section class="view" id="view-map" aria-labelledby="tab-map" hidden>
    <div class="map-bar">
      <div class="seg" role="group" aria-label="Time of day">
        <button id="modeDay" aria-pressed="true">Daytime</button>
        <button id="modeNight" aria-pressed="false">After dark</button>
      </div>
      <div class="legend" aria-label="Legend">
        <span class="lv lv-easy">Relaxed</span>
        <span class="lv lv-sharp">Stay sharp</span>
        <span class="lv lv-skip">Skip</span>
      </div>
    </div>
    <div id="map" role="application" aria-label="Map of Manhattan with safety zones and places"></div>
    <div class="map-actions">
      <button class="fab" id="locateBtn" aria-label="Show where I am">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      </button>
      <button class="fab" id="homeBtn" aria-label="Centre on the hotel">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      </button>
    </div>
    <div class="zone-card" id="zoneCard" hidden></div>
  </section>

  <section class="view" id="view-explore" aria-labelledby="tab-explore" hidden></section>
  <section class="view" id="view-safety" aria-labelledby="tab-safety" hidden></section>
  <section class="view" id="view-tips" aria-labelledby="tab-tips" hidden></section>
</main>

<nav class="tabs" aria-label="Sections">
  <button id="tab-today" data-view="today" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.500 17.5L5 19"/></svg>
    <span>Today</span>
  </button>
  <button id="tab-map" data-view="map">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>
    <span>Map</span>
  </button>
  <button id="tab-explore" data-view="explore">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
    <span>Explore</span>
  </button>
  <button id="tab-safety" data-view="safety">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3l8 3v6c0 5-3.500 8-8 9-4.500-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
    <span>Safety</span>
  </button>
  <button id="tab-tips" data-view="tips">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21l2-4M16 21l-2-4"/><circle cx="9" cy="14" r=".6" fill="currentColor"/><circle cx="15" cy="14" r=".6" fill="currentColor"/></svg>
    <span>Transit</span>
  </button>
</nav>

<!-- Place detail / settings / address sheets -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="driver" id="driver" role="dialog" aria-modal="true" aria-label="Hotel address" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
