<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your New York</title>
<meta name="description" content="A pocket guide to New York, 9–13 December: what to do, how to get there, and where to walk after dark.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="New York">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <main id="views">
    <section class="view" id="view-today" aria-label="Today"></section>

    <section class="view view-map" id="view-map" aria-label="Map" hidden>
      <div id="map" role="application" aria-label="Map of Manhattan"></div>
      <div class="map-top"><div class="chips" id="mapChips" role="group" aria-label="Show on the map"></div></div>
      <div class="map-ctl" role="group" aria-label="Map controls">
        <button id="locateBtn" data-act="map-locate" aria-label="Show where I am"></button>
        <button id="homeBtn" data-act="map-home" aria-label="Centre on the hotel"></button>
        <button id="modeBtn" data-act="map-mode" aria-label="Switch between daytime and after dark"></button>
      </div>
      <div class="map-bottom">
        <div class="map-legend" id="mapLegend" aria-label="Legend"></div>
        <div class="map-card" id="mapCard" hidden></div>
      </div>
      <details class="map-credit"><summary aria-label="Map data credits"></summary><p>© <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> · <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</p></details>
    </section>

    <section class="view" id="view-places" aria-label="Places" hidden></section>
    <section class="view" id="view-guide" aria-label="Guide" hidden></section>
  </main>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="page" id="page" role="dialog" aria-modal="true" hidden>
  <div class="page-grab" id="pageGrab"><span></span><button class="page-close" id="pageClose" data-act="close" aria-label="Close"></button></div>
  <div class="page-scroll" id="pageScroll"></div>
  <div class="page-bar" id="pageBar" hidden></div>
</section>
<div class="toast" id="toast" role="status" hidden></div>

<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/map.js"></script>
<script src="js/views.js"></script>
</body>
</html>
